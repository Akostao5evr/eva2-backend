<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SGR - Municipalidad de La Serena{% endblock %}</title>
    
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- SweetAlert2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: Arial, sans-serif;
        }
        .navbar-brand {
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .main-content {
            flex: 1;
        }
        footer {
            margin-top: auto;
        }
    </style>
</head>
<body>

    <!-- Navegación Principal -->
    <nav class="nav flex-column">
        <a class="nav-link {% if request.resolver_match.url_name == 'dashboard_delegaciones' %}active{% endif %}" href="{% url 'dashboard_delegaciones' %}">Inicio / Dashboard</a>
        <div class="sidebar-divider text-muted small fw-bold px-3 py-1">TABLAS MAESTRAS (CRUDs)</div>
        <a class="nav-link" href="{% url 'listado_delegaciones' %}">Delegaciones</a>
        <a class="nav-link" href="{% url 'listado_roles' %}">Roles</a>
        <a class="nav-link" href="{% url 'listado_funcionarios' %}">Usuarios</a>
        <a class="nav-link" href="{% url 'listado_items' %}">Ítems y metas</a>
        <a class="nav-link" href="{% url 'listado_tipos_atencion' %}">Tipo de Atención</a>
        <a class="nav-link" href="{% url 'listado_sub_atenciones' %}">Sub Atención</a>
        
        <div class="sidebar-divider text-muted small fw-bold px-3 py-1">OPERATIVO</div>
        <a class="nav-link" href="{% url 'listado_actividades' %}">Atenciones Ciudadanas</a>
    </nav>

    <!-- Contenido Dinámico de cada Vista -->
    <main class="main-content py-4">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Pie de Página Institucional -->
    <footer class="bg-dark text-white text-center py-3">
        <div class="container">
            <small>Ilustre Municipalidad de La Serena &copy; 2026 - Sistema de Gestión y Registro (SGR)</small>
        </div>
    </footer>

    <!-- JS de Bootstrap y SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
