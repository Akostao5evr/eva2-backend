{% extends 'base_auth.html' %}
{% block auth_content %}
<h3 class="fw-bold mb-1">Iniciar sesión</h3>
<p class="text-muted small mb-4">Accede con tu cuenta institucional.</p>

<form method="POST" novalidate>
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label text-secondary small">Usuario o correo</label>
        <input type="text" name="username" class="form-control" placeholder="usuario@example.test" required>
    </div>

    <div class="mb-4">
        <label class="form-label text-secondary small">Contraseña</label>
        <div class="input-group">
            <input type="password" name="password" id="loginPass" class="form-control" required>
            <button type="button" class="btn btn-outline-secondary small" onclick="togglePass('loginPass', this)">Mostrar</button>
        </div>
    </div>

    <button type="submit" class="btn btn-muni w-100 mb-3">Ingresar</button>
    <div>
        <a href="#" class="link-muni">¿Olvidaste tu contraseña?</a>
    </div>
</form>
{% endblock %}
