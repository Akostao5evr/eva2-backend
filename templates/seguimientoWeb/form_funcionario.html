{% extends 'base.html' %}

{% block content %}
<div class="mb-3">
    <div class="text-muted small">Gestión municipal / {{ modulo|default:"Registro" }}</div>
    <h3 class="fw-bold m-0">{{ titulo|default:"Formulario" }}</h3>
</div>

<div class="card border rounded-3 p-4 shadow-sm bg-white col-md-8">
    <form method="POST" id="formFuncionario">
        {% csrf_token %}
        {{ form.as_p }}
        
        <div class="d-flex justify-content-end gap-2 mt-4">
            <a href="{% url 'listado_funcionarios' %}" class="btn btn-light border px-4">Cancelar</a>
            <button type="submit" class="btn btn-muni px-4">Guardar registro</button>
        </div>
    </form>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const inputs = document.querySelectorAll('#formFuncionario input, #formFuncionario select');
        inputs.forEach(el => {
            if (el.tagName === 'SELECT') {
                el.classList.add('form-select');
            } else if (el.type !== 'checkbox') {
                el.classList.add('form-control');
            }
        });
    });
</script>
{% endblock %}
