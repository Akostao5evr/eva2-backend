{% extends 'base.html' %}

{% block content %}
<div class="mb-3">
    <div class="text-muted small">Gestión municipal / Atenciones</div>
    <h3 class="fw-bold m-0">Ingreso de atención / Actividad</h3>
</div>

<div class="card border rounded-3 p-4 shadow-sm bg-white">
    <form method="post" id="formCrearActividad">
        {% csrf_token %}
        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="form-label text-secondary small fw-bold">Vecino o solicitante *</label>
                <input type="text" name="solicitante" class="form-control" placeholder="Buscar por identificador o nombre..." required>
            </div>
            <div class="col-md-6">
                <label class="form-label text-secondary small fw-bold">Delegación de atención *</label>
                {{ form.delegacion }}
            </div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="form-label text-secondary small fw-bold">Tipo de Atención *</label>
                <select id="selectTipo" class="form-select" onchange="actualizarSubAtenciones()" required>
                    <option value="">Seleccione tipo...</option>
                    <option value="SOCIAL">Social</option>
                    <option value="SALUD">Salud</option>
                    <option value="EDUCACION">Educación</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label text-secondary small fw-bold">Sub Atención *</label>
                <select id="selectSub" class="form-select" required>
                    <option value="">Seleccione primero un Tipo de Atención...</option>
                </select>
            </div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="form-label text-secondary small fw-bold">Funcionario responsable *</label>
                {{ form.funcionario }}
            </div>
            <div class="col-md-6">
                <label class="form-label text-secondary small fw-bold">Estado de validación</label>
                {{ form.estado }}
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label text-secondary small fw-bold">Descripción de la atención *</label>
            {{ form.descripcion }}
        </div>

        <div class="d-flex justify-content-between align-items-center pt-2">
            <div class="text-muted small">
                Responsable: usuario de sesión &nbsp;|&nbsp; Fecha y hora: automáticas
            </div>
            <div class="d-flex gap-2">
                <a href="{% url 'listado_actividades' %}" class="btn btn-light border px-4">Cancelar</a>
                <button type="submit" id="btnSubmit" class="btn btn-muni px-4">Guardar atención</button>
            </div>
        </div>
    </form>
</div>

<script>
    // Relación dependiente Tipo de Atención -> Sub Atención (Requisito A2 y ACT-05)
    const subOpciones = {
        'SOCIAL': ['Ayuda social', 'Orientación social'],
        'SALUD': ['Consulta médica', 'Operativo salud'],
        'EDUCACION': ['Beca municipal', 'Apoyo escolar']
    };

    function actualizarSubAtenciones() {
        const tipo = document.getElementById('selectTipo').value;
        const subSelect = document.getElementById('selectSub');
        subSelect.innerHTML = '<option value="">Seleccione sub atención...</option>';

        if (tipo && subOpciones[tipo]) {
            subOpciones[tipo].forEach(function(item) {
                const opt = document.createElement('option');
                opt.value = item;
                opt.textContent = item;
                subSelect.appendChild(opt);
            });
        }
    }

    // Estilizar los widgets de Django automáticamente con clases Bootstrap
    document.addEventListener('DOMContentLoaded', function() {
        const selects = document.querySelectorAll('#formCrearActividad select');
        selects.forEach(s => s.classList.add('form-select'));
        const textareas = document.querySelectorAll('#formCrearActividad textarea');
        textareas.forEach(t => {
            t.classList.add('form-control');
            t.rows = 3;
            t.placeholder = 'Describa la solicitud y los antecedentes necesarios.';
        });
    });
</script>
{% endblock %}
